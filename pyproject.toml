[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kgeo"
version = "0.0.1"
description = "Analytic Kerr Raytracing"
readme = "README.md"
license = { text = "GPLv3" }
authors = [
    { name = "Andrew Chael", email = "achael@princeton.edu" },
]
keywords = ["astronomy", "EHT", "black holes"]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "mpmath",
    "tqdm",
    "matplotlib",
    "ehtim",
    "h5py",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/achael/kgeo"
Download = "https://github.com/achael/kgeo/archive/v0.0.1.tar.gz"

[tool.setuptools]
packages = ["kgeo"]

[tool.setuptools.package-data]
kgeo = ["data/*.dat", "data/*.csv"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long — legacy code has many long lines
    "E741",   # ambiguous variable name (l, I, O) — common in physics code
    "F841",   # local variable assigned but never used — catch gradually
    "E701",   # multiple statements on one line colon -- fix later
    "E702",   # multiple statements on one line semicolon -- fix later
    "E722",   # bare except -- fix later
    "UP031",   # print string formatting -- fix later
    "F405",   # star imports -- fix later
    "F403",   # star imports -- fix later
    "F401"   # unused imports -- fix later
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["kgeo"]

# --- coverage ---

[tool.coverage.run]
source = ["kgeo"]

[tool.coverage.report]
show_missing = true
skip_empty = true

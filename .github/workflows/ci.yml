name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15"
          args: "--version"
      # PRs lint against the target branch; pushes lint against the previous
      # tip of the pushed branch (github.base_ref is empty on push events).
      - name: Determine lint base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            # new branch or force push: fall back to the last commit
            BASE="HEAD~1"
          fi
          echo "LINT_BASE=$BASE" >> "$GITHUB_ENV"
      - name: Ruff check (changed files only)
        run: |
          echo "Linting Python files changed since $LINT_BASE"
          FILES=$(git diff --name-only --diff-filter=ACMR "$LINT_BASE"...HEAD -- '*.py')
          if [ -n "$FILES" ]; then
            echo "$FILES"
            echo "$FILES" | xargs ruff check
          else
            echo "No Python files changed"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-branch --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
